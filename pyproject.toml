[project]
name = "kisan"
version = "0.1.0"
description = "Kisan animal listing verification platform (pilot)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiokafka>=0.11",
  "temporalio>=1.7",
  "qdrant-client>=1.10",
  "boto3>=1.34",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
  "imagehash>=4.3",
]

[project.optional-dependencies]
# Local GPU/CPU inference without Triton (dev laptops, pilot single node)
local-ml = ["ultralytics>=8.3", "torch>=2.3", "timm>=1.0", "open_clip_torch>=2.24"]
# Production inference through NVIDIA Triton
triton = ["tritonclient[grpc]>=2.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.20", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kisan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
